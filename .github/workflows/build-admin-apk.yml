name: Build Lanchonete Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'android-admin-app/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lanchonete-admin-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: lanchonete-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Wrangler
        run: npm install --global wrangler@4

      - name: Criar chave exclusiva sem expor o segredo
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::O secret CLOUDFLARE_API_TOKEN não está configurado."
            exit 1
          fi
          APP_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN}|${WORKER_NAME}|admin-apk-v1" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$APP_TOKEN"
          echo "APP_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android-admin-app
        run: gradle --no-daemon :app:assembleDebug -PadminAppToken="$APP_TOKEN"

      - name: Conferir chave compilada
        shell: bash
        run: |
          unzip -p android-admin-app/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' > "$RUNNER_TEMP/admin-classes.dex"
          if ! grep -aFq "$APP_TOKEN" "$RUNNER_TEMP/admin-classes.dex"; then
            echo "::error::A chave automática não foi encontrada no APK."
            exit 1
          fi

      - name: Cadastrar chave no Worker
        shell: bash
        run: printf '%s' "$APP_TOKEN" | wrangler secret put ADMIN_APP_TOKEN --config wrangler.jsonc

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android-admin-app/app/build/outputs/apk/debug/app-debug.apk apk/Lanchonete-Admin-v1.8.apk
          cp android-admin-app/app/build/outputs/apk/debug/app-debug.apk apk/Lanchonete-Admin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lanchonete-Admin-v1.8
          path: apk/Lanchonete-Admin-v1.8.apk

      - name: Save APK in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Lanchonete-Admin.apk apk/Lanchonete-Admin-v1.8.apk
          if git diff --cached --quiet; then
            echo "APK sem alterações."
            exit 0
          fi
          git commit -m "Atualizar APK administrador v1.8 [skip ci]"
          git push
