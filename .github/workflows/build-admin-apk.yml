name: Build Lanchonete Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'android-admin-app/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-admin-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android-admin-app/app/build/outputs/apk/debug/app-debug.apk apk/Lanchonete-Admin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lanchonete-Admin-APK
          path: apk/Lanchonete-Admin.apk

      - name: Save APK in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Lanchonete-Admin.apk
          if git diff --cached --quiet; then
            echo "APK sem alterações."
            exit 0
          fi
          git commit -m "Atualizar APK do painel administrativo [skip ci]"
          git push
