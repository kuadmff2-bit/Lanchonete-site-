name: Build Lanchonete Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'android-admin-app/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lanchonete-admin-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: lanchonete-site
      WORKER_URL: https://lanchonete-site.kuadmff2.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Wrangler
        run: npm install --global wrangler@4

      - name: Criar chave exclusiva sem expor o segredo
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::O secret CLOUDFLARE_API_TOKEN não está configurado."
            exit 1
          fi
          APP_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN}|${WORKER_NAME}|admin-apk-v1" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$APP_TOKEN"
          echo "APP_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android-admin-app
        run: gradle --no-daemon :app:assembleDebug -PadminAppToken="$APP_TOKEN"

      - name: Conferir chave compilada
        shell: bash
        run: |
          unzip -p android-admin-app/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' > "$RUNNER_TEMP/admin-classes.dex"
          if ! grep -aFq "$APP_TOKEN" "$RUNNER_TEMP/admin-classes.dex"; then
            echo "::error::A chave automática não foi encontrada no APK."
            exit 1
          fi

      - name: Cadastrar chave no Worker
        shell: bash
        run: printf '%s' "$APP_TOKEN" | wrangler secret put ADMIN_APP_TOKEN --config wrangler.jsonc

      - name: Conferir aparelhos cadastrados no push
        shell: bash
        run: |
          mkdir -p apk/diagnostics
          HTTP_CODE="$(curl --silent --show-error \
            -H "x-admin-app-token: $APP_TOKEN" \
            -o "$RUNNER_TEMP/push-device-status.json" \
            -w '%{http_code}' \
            "$WORKER_URL/api/push/register" || true)"

          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            PUSH_FILE="$RUNNER_TEMP/push-device-status.json" OUT_FILE="apk/diagnostics/lanchonete-site-devices.json" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.env.PUSH_FILE, 'utf8'));
          const status = {
            worker: 'lanchonete-site',
            diagnosticAvailable: true,
            fcmServerConfigured: Boolean(data.configured),
            registeredDevices: Number(data.devices || 0)
          };
          fs.writeFileSync(process.env.OUT_FILE, JSON.stringify(status, null, 2) + '\n');
          console.log(`Push: servidor=${status.fcmServerConfigured ? 'ok' : 'incompleto'}, aparelhos=${status.registeredDevices}`);
          if (status.registeredDevices < 1) {
            console.log('::warning title=Nenhum APK cadastrado no push::Abra o APK atualizado e permita notificações para registrar este celular.');
          }
          NODE
          else
            cat > apk/diagnostics/lanchonete-site-devices.json <<EOF
          {
            "worker": "lanchonete-site",
            "diagnosticAvailable": false,
            "httpStatus": "$HTTP_CODE"
          }
          EOF
            echo "::warning title=Diagnóstico de aparelhos indisponível::A consulta respondeu HTTP ${HTTP_CODE:-sem-resposta}; o APK continuará sendo gerado normalmente."
          fi

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android-admin-app/app/build/outputs/apk/debug/app-debug.apk apk/Lanchonete-Admin-v1.9.apk
          cp android-admin-app/app/build/outputs/apk/debug/app-debug.apk apk/Lanchonete-Admin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lanchonete-Admin-v1.9
          path: |
            apk/Lanchonete-Admin-v1.9.apk
            apk/diagnostics/lanchonete-site-devices.json

      - name: Save APK in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Lanchonete-Admin.apk apk/Lanchonete-Admin-v1.9.apk apk/diagnostics/lanchonete-site-devices.json
          if git diff --cached --quiet; then
            echo "APK sem alterações."
            exit 0
          fi
          git commit -m "Atualizar APK administrador v1.9 [skip ci]"
          git pull --rebase origin main
          git push
