name: Configurar push relay dos três Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-push-relay.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: kuadmff2-bit/Lanchonete-site-
            worker: lanchonete-site
          - repository: kuadmff2-bit/lanchonete-2
            worker: lanchonete-2
          - repository: kuadmff2-bit/lanchonete-3
            worker: lanchonete-3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: main

      - name: Instalar Wrangler
        run: npm install --global wrangler@4

      - name: Criar chave interna do relay
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN não está configurado."
            exit 1
          fi
          RELAY_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN}|lanchonete-push-relay-v1" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$RELAY_TOKEN"
          printf '%s' "$RELAY_TOKEN" | wrangler secret put PUSH_RELAY_TOKEN --config wrangler.jsonc
